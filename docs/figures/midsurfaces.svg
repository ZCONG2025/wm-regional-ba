<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" role="img" aria-label="Eight nested iso-potential surfaces between the lateral ventricle and the WM/GM boundary, resampled to a common icosphere">
  <title>Laplacian white-matter mid-surfaces</title>

  <rect x="0" y="0" width="780" height="372" rx="8" fill="#f6f7f9" stroke="#d9dde3"/>

  <!-- ================= left: the nested surfaces ================= -->
  <text x="28" y="34" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2b3138">1. Solve the Laplace equation in the white matter</text>
  <text x="28" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480">coronal schematic, one hemisphere</text>

  <g transform="translate(-20,32)">
    <!-- white matter region, bounded by the WM/GM surface -->
    <ellipse cx="170" cy="150" rx="115" ry="95" fill="#e9edf2" stroke="#2b3138" stroke-width="2.5"/>

    <!-- the eight iso-potential surfaces, level 1 outermost -->
    <ellipse cx="174.4" cy="150" rx="104.7" ry="88.7" fill="none" stroke="#e8734a" stroke-width="1.8"/>
    <ellipse cx="178.9" cy="150" rx="94.3"  ry="82.3" fill="none" stroke="#e8944a" stroke-width="1.8"/>
    <ellipse cx="183.3" cy="150" rx="84.0"  ry="76.0" fill="none" stroke="#d9a94e" stroke-width="1.8"/>
    <ellipse cx="187.8" cy="150" rx="73.7"  ry="69.7" fill="none" stroke="#a8b055" stroke-width="1.8"/>
    <ellipse cx="192.2" cy="150" rx="63.3"  ry="63.3" fill="none" stroke="#6fae7a" stroke-width="1.8"/>
    <ellipse cx="196.7" cy="150" rx="53.0"  ry="57.0" fill="none" stroke="#4a9fa8" stroke-width="1.8"/>
    <ellipse cx="201.1" cy="150" rx="42.7"  ry="50.7" fill="none" stroke="#4a7fbd" stroke-width="1.8"/>
    <ellipse cx="205.6" cy="150" rx="32.3"  ry="44.3" fill="none" stroke="#5a5fb0" stroke-width="1.8"/>

    <!-- lateral ventricle: the inner Dirichlet boundary -->
    <ellipse cx="210" cy="150" rx="22" ry="38" fill="#2b3138"/>

    <!-- boundary annotations -->
    <line x1="88" y1="72" x2="118" y2="96" stroke="#6b7480" stroke-width="1"/>
    <text x="26" y="68" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#2b3138">WM/GM boundary</text>
    <text x="26" y="81" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">V = 10000</text>

    <line x1="232" y1="196" x2="252" y2="216" stroke="#6b7480" stroke-width="1"/>
    <text x="238" y="232" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#2b3138">lateral ventricle</text>
    <text x="238" y="245" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">V = 0</text>
  </g>

  <!-- ================= middle: level legend ================= -->
  <text x="316" y="34" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2b3138">2. Take eight iso-levels</text>
  <text x="316" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480">nested, never self-intersecting</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#2b3138">
    <rect x="316" y="72"  width="22" height="3" fill="#e8734a"/><text x="348" y="77">lvl 1</text><text x="404" y="77" fill="#6b7480">V = 9995</text>
    <rect x="316" y="94"  width="22" height="3" fill="#e8944a"/><text x="348" y="99">lvl 2</text><text x="404" y="99" fill="#6b7480">V = 9970</text>
    <rect x="316" y="116" width="22" height="3" fill="#d9a94e"/><text x="348" y="121">lvl 3</text><text x="404" y="121" fill="#6b7480">V = 9880</text>
    <rect x="316" y="138" width="22" height="3" fill="#a8b055"/><text x="348" y="143">lvl 4</text><text x="404" y="143" fill="#6b7480">V = 9500</text>
    <rect x="316" y="160" width="22" height="3" fill="#6fae7a"/><text x="348" y="165">lvl 5</text><text x="404" y="165" fill="#6b7480">V = 8700</text>
    <rect x="316" y="182" width="22" height="3" fill="#4a9fa8"/><text x="348" y="187">lvl 6</text><text x="404" y="187" fill="#6b7480">V = 7300</text>
    <rect x="316" y="204" width="22" height="3" fill="#4a7fbd"/><text x="348" y="209">lvl 7</text><text x="404" y="209" fill="#6b7480">V = 6000</text>
    <rect x="316" y="226" width="22" height="3" fill="#5a5fb0"/><text x="348" y="231">lvl 8</text><text x="404" y="231" fill="#6b7480">V = 5000</text>
  </g>

  <text x="316" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">level 1 sits just under the cortex,</text>
  <text x="316" y="281" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">level 8 sits deep, near the ventricle</text>

  <!-- arrow -->
  <path d="M 486 152 L 526 152" stroke="#9aa2ad" stroke-width="1.5" fill="none"/>
  <path d="M 526 152 l -7 -4 l 0 8 z" fill="#9aa2ad"/>

  <!-- ================= right: the output ================= -->
  <text x="548" y="34" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2b3138">3. Sample FLAIR</text>
  <text x="548" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7480">on a shared icosphere</text>

  <!-- icosphere glyph -->
  <g transform="translate(614,132)" stroke="#4a7fbd" fill="none" stroke-width="1.2">
    <circle cx="0" cy="0" r="46" stroke="#2b3138" stroke-width="1.8"/>
    <ellipse cx="0" cy="0" rx="46" ry="17"/>
    <ellipse cx="0" cy="0" rx="46" ry="33"/>
    <ellipse cx="0" cy="0" rx="17" ry="46"/>
    <ellipse cx="0" cy="0" rx="33" ry="46"/>
  </g>

  <text x="548" y="212" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#2b3138">40962 vertices / hemisphere</text>
  <text x="548" y="230" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#2b3138">8 levels x 2 hemispheres</text>

  <rect x="548" y="248" width="200" height="46" rx="4" fill="#e9edf2" stroke="#d9dde3"/>
  <text x="560" y="266" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#2b3138">655392 values per scan</text>
  <text x="560" y="283" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#6b7480">vertex i = same location</text>

  <text x="548" y="316" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">in every subject, so a cohort</text>
  <text x="548" y="331" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7480">stacks into one matrix</text>
</svg>
