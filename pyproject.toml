[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmba"
version = "1.0.0"
description = "Laplacian white-matter mid-surfaces and FLAIR sampling for regional white-matter brain age"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cong Zang" }]
keywords = ["neuroimaging", "white matter", "FreeSurfer", "brain age", "FLAIR"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "nibabel>=5.0",
  "mne>=1.5",
  "scikit-image>=0.21",
  "trimesh>=4.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dicom = ["SimpleITK>=2.3"]

[tool.setuptools]
packages = ["wmba"]
